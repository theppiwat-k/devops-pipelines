name: CI PIPELINE

on:
  push:
    branch: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@y5

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
            node-version: 16

      - name: Install dependencies
        uses: npm Install

      - name: Run tests
        run: npm test